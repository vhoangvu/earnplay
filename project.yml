name: EarnPlay
options:
  bundleIdPrefix: com.vhoangvu
  deploymentTarget:
    iOS: "18.0"
packages:
  EarnPlayCore:
    path: EarnPlayCore
targets:
  EarnPlay:
    type: application
    platform: iOS
    sources:
      - EarnPlay
    dependencies:
      - package: EarnPlayCore
    info:
      path: EarnPlay/Info.plist
      properties:
        NSBonjourServices:
          - _earnplay-sync._tcp
          - _earnplay-sync._udp
    settings:
      base:
        PRODUCT_NAME: EarnPlay
        PRODUCT_BUNDLE_IDENTIFIER: com.vhoangvu.earnplay
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "EarnPlay syncs with the nearby parent/child app over Bluetooth and local peer-to-peer only. No account, server, or internet is used."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "EarnPlay syncs policy and session logs with the nearby admin/child app over Bluetooth."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
  EarnPlayAdmin:
    type: application
    platform: iOS
    sources:
      - EarnPlayAdmin
    dependencies:
      - package: EarnPlayCore
    info:
      path: EarnPlayAdmin/Info.plist
      properties:
        NSBonjourServices:
          - _earnplay-sync._tcp
          - _earnplay-sync._udp
    settings:
      base:
        PRODUCT_NAME: EarnPlayAdmin
        PRODUCT_BUNDLE_IDENTIFIER: com.vhoangvu.earnplay.admin
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "EarnPlay syncs with the nearby parent/child app over Bluetooth and local peer-to-peer only. No account, server, or internet is used."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "EarnPlay syncs policy and session logs with the nearby admin/child app over Bluetooth."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
  EarnPlayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EarnPlayTests
    dependencies:
      - target: EarnPlay
      - package: EarnPlayCore
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        PRODUCT_NAME: EarnPlayTests
        PRODUCT_BUNDLE_IDENTIFIER: com.vhoangvu.earnplay.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        BUNDLE_LOADER: "$(TEST_HOST)"
  EarnPlayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EarnPlayUITests
    dependencies:
      - target: EarnPlay
      - target: EarnPlayAdmin
    settings:
      base:
        PRODUCT_NAME: EarnPlayUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.vhoangvu.earnplay.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: EarnPlay
schemes:
  EarnPlay:
    build:
      targets:
        EarnPlay: all
        # Issue #71: the walkthrough drives the admin app from the same
        # UI-test target via its bundle identifier, so the scheme builds
        # (and the test run installs) EarnPlayAdmin alongside the child.
        EarnPlayAdmin: all
        EarnPlayTests: [test]
        EarnPlayUITests: [test]
    test:
      targets:
        - name: EarnPlayTests
        - name: EarnPlayUITests
  EarnPlayAdmin:
    build:
      targets:
        EarnPlayAdmin: all
