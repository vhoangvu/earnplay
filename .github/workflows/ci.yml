name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build + test (Xcode, iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Known CI gap (T7.1): runners do not fetch llama.xcframework (gitignored,
      # ~380 MB unpacked) or the spike GGUF, so real-inference tests XCTSkip.
      # Staging the model into CI is a separate human decision (cost/runtime).
      - name: Test EarnPlayCore package
        run: swift test --package-path EarnPlayCore

      - name: Build child app and run unit tests
        run: |
          xcodebuild test \
            -project EarnPlay.xcodeproj \
            -scheme EarnPlay \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build admin app
        run: |
          xcodebuild build \
            -project EarnPlay.xcodeproj \
            -scheme EarnPlayAdmin \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
